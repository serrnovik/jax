name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install test dependencies
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq ([version]'5.7.1'))) {
            Install-Module Pester -Scope CurrentUser -RequiredVersion 5.7.1 -Force
          }
          if (-not (Get-Module -ListAvailable powershell-yaml | Where-Object Version -eq ([version]'0.4.12'))) {
            Install-Module powershell-yaml -Scope CurrentUser -RequiredVersion 0.4.12 -Force
          }
      - name: Test
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1
      - name: Public-source audit
        shell: pwsh
        run: ./tests/Test-PublicSource.ps1
